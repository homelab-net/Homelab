#cloud-config
# Cloud-init configuration for dns-1 (192.168.8.81)

hostname: dns-1
fqdn: dns-1.local
manage_etc_hosts: true

# User configuration
users:
  - name: ubuntu
    groups: [adm, cdrom, dip, plugdev, sudo, docker]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: false
    ssh_authorized_keys:
      - ${SSH_KEY}  # Replace with your SSH public key

# Package updates and upgrades
package_update: true
package_upgrade: true

# Install required packages
packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - qemu-guest-agent
  - net-tools
  - vim
  - git
  - wget
  - ufw

# Docker installation
runcmd:
  # Install Docker
  - curl -fsSL https://get.docker.com -o /tmp/get-docker.sh
  - sh /tmp/get-docker.sh
  - systemctl enable docker
  - systemctl start docker
  - usermod -aG docker ubuntu

  # Install Docker Compose
  - curl -SL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 -o /usr/local/bin/docker-compose
  - chmod +x /usr/local/bin/docker-compose
  - ln -s /usr/local/bin/docker-compose /usr/bin/docker-compose

  # Configure firewall
  - ufw --force enable
  - ufw allow 22/tcp    # SSH
  - ufw allow 53/tcp    # DNS
  - ufw allow 53/udp    # DNS
  - ufw allow 80/tcp    # HTTP (Technitium web interface)
  - ufw allow 443/tcp   # HTTPS
  - ufw allow 5380/tcp  # Technitium admin panel
  - ufw allow 67/udp    # DHCP (if needed)

  # Enable and start qemu-guest-agent
  - systemctl enable qemu-guest-agent
  - systemctl start qemu-guest-agent

  # Create directory for Technitium DNS
  - mkdir -p /opt/technitium/config
  - chown -R ubuntu:ubuntu /opt/technitium

  # Set timezone
  - timedatectl set-timezone UTC

  # Configure DNS temporarily (will be replaced by Technitium)
  - echo "nameserver 1.1.1.1" > /etc/resolv.conf
  - echo "nameserver 8.8.8.8" >> /etc/resolv.conf

# System configuration
write_files:
  - path: /etc/sysctl.d/99-dns-tuning.conf
    content: |
      # DNS server tuning
      net.core.rmem_max = 26214400
      net.core.rmem_default = 26214400
      net.core.wmem_max = 26214400
      net.core.wmem_default = 26214400
      net.ipv4.tcp_rmem = 4096 87380 26214400
      net.ipv4.tcp_wmem = 4096 65536 26214400
      net.ipv4.ip_local_port_range = 1024 65535
      net.core.netdev_max_backlog = 5000
    owner: root:root
    permissions: '0644'

  - path: /etc/systemd/resolved.conf
    content: |
      [Resolve]
      DNS=127.0.0.1
      FallbackDNS=1.1.1.1 8.8.8.8
      DNSStubListener=no
    owner: root:root
    permissions: '0644'

# Final commands
final_message: |
  ========================================
  dns-1 Cloud-Init Complete!
  ========================================
  Hostname: dns-1
  IP: 192.168.8.81
  Docker: Installed
  Docker Compose: Installed
  Firewall: Configured

  Next Steps:
  1. SSH into the server: ssh ubuntu@192.168.8.81
  2. Deploy Technitium DNS using docker-compose
  3. Access web interface: http://192.168.8.81:5380

  System is ready for DNS service deployment!
  ========================================

# Reboot after cloud-init to apply all settings
power_state:
  mode: reboot
  timeout: 300
  condition: True
